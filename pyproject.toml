[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaocli-auto"
version = "0.4.0"
description = "An unofficial KakaoTalk CLI for Windows with room search, message triage and schedule comparison"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pywin32>=306", "numpy>=1.26", "cryptography>=42"]

[project.scripts]
kakaocli = "kakaocli_win.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
